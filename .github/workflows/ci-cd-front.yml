name: CI/CD Frontend

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# L6: domyślnie GITHUB_TOKEN tylko do odczytu
permissions:
  contents: read

jobs:
  # L6: skan sekretów, SAST, skan zależności, skan obrazu, DAST (plik security.yml)
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  test:
    name: Testy i budowanie Frontendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  deploy:
    name: Wdrożenie Frontendu na AWS
    needs: [test, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # L6: pozwala jobowi pobrać token OIDC od GitHuba
    steps:
      # L6: logowanie do AWS przez OIDC – bez stałych kluczy w GitHub Secrets.
      # GitHub wystawia token dla tego joba, AWS wymienia go na tymczasowe poświadczenia
      # roli github-granda-deploy (zaufanie tylko dla tego repo w environmencie production).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Aktualizacja kontenera frontend przez SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=granda-app" \
            --parameters 'commands=[
              "cd /opt/granda/frontend",
              "git remote set-url origin https://github.com/oliviam555/granda-front.git",
              "git pull origin master",
              "cd /opt/granda && DOCKER_BUILDKIT=1 docker compose up -d --build frontend"
            ]'
