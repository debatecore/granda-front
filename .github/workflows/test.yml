name: Run tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# L6: domyślnie GITHUB_TOKEN tylko do odczytu
permissions:
  contents: read

jobs:
  jest-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Lint
        run: npx eslint "src/**"

      - name: Check formatting
        run: npx prettier . --check
    
  version-check:
    name: Check package version
    runs-on: ubuntu-latest

    # Dependabot zmienia tylko pliki lock i nie podbija wersji aplikacji – pomijamy dla niego ten check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # L6: wartość z kontekstu github przez env, a nie wklejana bezpośrednio do skryptu (shell injection)
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Check package.json and package-lock.json versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_version.py "origin/$BASE_REF"


